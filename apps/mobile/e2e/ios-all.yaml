appId: eu.drafto.mobile
---
# Combined iOS E2E flow - all tests in a single run
# Pass -e RUN_ID=<timestamp> -e E2E_TEST_EMAIL=... -e E2E_TEST_PASSWORD=...
# Run with: maestro test apps/mobile/e2e/ios-all.yaml --platform ios

# ===== FLOW 01: Login =====
- clearKeychain
- stopApp
- clearState
- launchApp

- extendedWaitUntil:
    visible: "Log In"
    timeout: 60000
- assertVisible: "Sign in to your Drafto account"

# --- Test: a sign-up that needs email confirmation says so (App Review recording, 0:36) ---
# Uses the existing test account on purpose: Supabase answers an address that already has an
# account exactly like a new one (no session) and sends no email, so this creates no user and
# no mail. The app must show the check-your-email state, not bounce back to Log In.
- tapOn:
    id: "signup-link"
- extendedWaitUntil:
    visible: "Create your Drafto account"
    timeout: 10000
- tapOn: "you@example.com"
- inputText: ${E2E_TEST_EMAIL}
- tapOn: "Min. 6 characters"
- inputText: "not-the-real-password"
- hideKeyboard
- tapOn:
    id: "signup-submit"
- extendedWaitUntil:
    visible: "Check Your Email"
    timeout: 20000
- assertVisible: ${E2E_TEST_EMAIL}
- tapOn: "Back to login"
- extendedWaitUntil:
    visible: "Sign in to your Drafto account"
    timeout: 10000

- tapOn: "you@example.com"
- inputText: ${E2E_TEST_EMAIL}
- tapOn: "Sign in to your Drafto account"
- tapOn: "Your password"
- inputText: ${E2E_TEST_PASSWORD}
- tapOn: "Sign in to your Drafto account"
- tapOn:
    id: "login-button"

- extendedWaitUntil:
    visible: "Notebooks"
    timeout: 30000

# Wait for sync to settle before interacting
- waitForAnimationToEnd

# ===== FLOW 02: Create notebooks =====

# --- Create a notebook ---
- tapOn:
    id: "add"
- extendedWaitUntil:
    visible: "Notebook name"
    timeout: 10000
- inputText: "NB ${RUN_ID}"
- tapOn:
    id: "checkmark"
- extendedWaitUntil:
    visible: ".*NB ${RUN_ID}"
    timeout: 10000

# --- Create a second notebook ---
- tapOn:
    id: "add"
- extendedWaitUntil:
    visible: "Notebook name"
    timeout: 10000
- tapOn:
    id: "notebook-name-input"
- inputText: "SECOND ${RUN_ID}"
- tapOn:
    id: "checkmark"
- extendedWaitUntil:
    visible: ".*SECOND ${RUN_ID}"
    timeout: 15000

# --- Cancel creating a notebook ---
- tapOn:
    id: "add"
- assertVisible: "Notebook name"
- inputText: "Should Not Exist"
- tapOn:
    id: "close"
- assertNotVisible: "Should Not Exist"

# --- Rename via long press ---
- longPressOn: ".*SECOND ${RUN_ID}"
- eraseText
- inputText: "RENAMED ${RUN_ID}"
- tapOn:
    id: "checkmark"
- extendedWaitUntil:
    visible: ".*RENAMED ${RUN_ID}"
    timeout: 10000
- assertNotVisible: ".*SECOND ${RUN_ID}"
- assertVisible: ".*NB ${RUN_ID}"

# ===== FLOW 03: Create and edit notes =====

# Navigate to the test notebook
- tapOn: ".*NB ${RUN_ID}"

- extendedWaitUntil:
    visible: "No notes yet"
    timeout: 10000
    optional: true

# --- Create a note with title ---
- tapOn:
    id: "add"
- assertVisible: "Note title (optional)"
- inputText: "Note ${RUN_ID}"
- tapOn:
    id: "checkmark"
- extendedWaitUntil:
    visible: ".*Note ${RUN_ID}.*"
    timeout: 10000

# --- Create a note without title ---
- tapOn:
    id: "add"
- assertVisible: "Note title (optional)"
- tapOn:
    id: "checkmark"
- extendedWaitUntil:
    visible: ".*Untitled.*"
    timeout: 10000

# --- Cancel note creation ---
- tapOn:
    id: "add"
- assertVisible: "Note title (optional)"
- inputText: "Cancelled Note"
- tapOn:
    id: "close"
- assertNotVisible: ".*Cancelled Note"

# --- Open note in editor ---
- tapOn: ".*Note ${RUN_ID}.*"
- extendedWaitUntil:
    visible: ".*Note ${RUN_ID}.*"
    timeout: 10000

# --- Go back (iOS: tap header back button) and rename via long press ---
- tapOn: "Notes"
- extendedWaitUntil:
    visible: ".*Note ${RUN_ID}.*"
    timeout: 10000
- longPressOn: ".*Note ${RUN_ID}.*"
- eraseText
- inputText: "NoteF ${RUN_ID}"
- tapOn:
    id: "checkmark"
- extendedWaitUntil:
    visible: ".*NoteF ${RUN_ID}.*"
    timeout: 10000

# ===== FLOW 04: Navigate back to Notebooks =====

# Go back to Notebooks (iOS: tap header back button labeled "Notebooks")
- tapOn: "Notebooks"
- extendedWaitUntil:
    visible: "Notebooks"
    timeout: 10000
- extendedWaitUntil:
    visible: ".*NB ${RUN_ID}.*"
    timeout: 10000

# ===== FLOW 07: Delete account (cancel only) =====
# NEVER taps an enabled confirm — the shared E2E user must not be deleted.
# "DELET" rather than "delete": the input auto-capitalises.
# Dialog waits use the input's id: the text regex "Delete account?" would also
# match the row's "Delete account" label behind the dialog.

- tapOn: "Settings, tab.*"
- scrollUntilVisible:
    element:
      id: "delete-account-row"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "delete-account-row"
- extendedWaitUntil:
    visible:
      id: "delete-account-input"
    timeout: 10000
- assertVisible: "Type DELETE to confirm"
- assertVisible:
    id: "delete-account-confirm"
    enabled: false

# --- Wrong text keeps the destructive button disabled ---
- tapOn:
    id: "delete-account-input"
- inputText: "DELET"
- hideKeyboard
- assertVisible:
    id: "delete-account-confirm"
    enabled: false

# --- Cancel closes the dialog; the user and their data are still there ---
- tapOn:
    id: "delete-account-cancel"
- extendedWaitUntil:
    notVisible:
      id: "delete-account-input"
    timeout: 10000
- assertVisible:
    id: "delete-account-row"
- tapOn: "Notebooks, tab.*"
- extendedWaitUntil:
    visible: ".*NB ${RUN_ID}.*"
    timeout: 10000
