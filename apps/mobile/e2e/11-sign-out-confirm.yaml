appId: eu.drafto.mobile
tags:
  - qa-10668
---
# Default: Cancel only. Pass -e SIGN_OUT_CONFIRM=1 to also confirm (see below).
# No `env:` default in the header: Maestro 2.11 lets a flow's own `env:` value
# win over `-e`, so a "0" there kept the confirm leg from ever running.
# Flow 11: Sign-out confirmation (PrimeTestLab report 10668, S-02)
# Tests: Settings "Sign Out" always asks first. With everything synced the
# native alert reads "Sign out?" / "Everything is synced. Your notes will be
# here when you sign back in." with Cancel / Sign out. Cancel (and, on Android,
# the back key) keeps the user signed in on Settings.
# Before the fix one tap signed out and wiped the device at once, so the wait
# for the dialog below times out on 1.4.7.
# Depends on: 01-login (user is logged in), unless -e E2E_SIGNOUT_EMAIL is
# given: then it signs in as that account itself (below).
#
# Optional env:
#   -e SIGN_OUT_CONFIRM=1  also confirm and assert the Log In screen. Sign-out is
#     global (it ends every session of the account), so it needs a dedicated
#     dev account and refuses without one: never the shared E2E user, whose
#     session web CI's Playwright run uses.
#   -e E2E_SIGNOUT_EMAIL=… with -e E2E_SIGNOUT_PASSWORD=… (or, from
#     run-qa-10668-e2e.sh, MAESTRO_E2E_SIGNOUT_PASSWORD in the environment):
#     the flow switches the device to that account first and runs both legs
#     on it. Required with SIGN_OUT_CONFIRM=1, and for a build without the fix
#     (it signs out at the first tap). See apps/mobile/e2e/README.md. The
#     device ends on that account, or signed out, so run 01-login again before
#     other flows. Don't run the confirm leg on two devices at once: they share
#     the account, and one's sign-out ends the other's session.
#
# Selectors:
# - Maestro text selectors are regexes: "Sign out?" would also match the
#   Settings button's own "Sign out" label, so the title is "Sign out\\?".
# - Native alert buttons carry no testIDs. Android maps RN's two buttons to
#   android:id/button2 (Cancel, negative) and android:id/button1 (Sign out,
#   positive); Material dialogs may render the labels in capitals, so the ids
#   are used. On iOS the alert's "Sign out" shares its label with the Settings
#   button behind it, so the confirm tap is anchored right of the alert's Cancel.
#
# No RUN_ID needed — this flow creates no user data.

# --- On the dedicated sign-out account, when one is given ---
# With -e E2E_SIGNOUT_EMAIL (run-qa-10668-e2e.sh passes it for SIGN_OUT_CONFIRM=1
# and for --before), the whole flow runs on that account: a clean start drops
# the shared E2E user's local session without signing it out anywhere, then
# signs in as the dedicated one. That covers --before too, where a build
# without the fix signs out at the first tap with no dialog.
- runFlow:
    when:
      true: ${typeof E2E_SIGNOUT_EMAIL !== 'undefined' && E2E_SIGNOUT_EMAIL !== ''}
    commands:
      - assertTrue:
          condition: ${typeof E2E_TEST_EMAIL !== 'undefined' && E2E_SIGNOUT_EMAIL.toLowerCase() !== E2E_TEST_EMAIL.toLowerCase() && (typeof E2E_SIGNOUT_PASSWORD !== 'undefined' || typeof MAESTRO_E2E_SIGNOUT_PASSWORD !== 'undefined')}
          label: "E2E_SIGNOUT_EMAIL needs -e E2E_TEST_EMAIL (and must differ from it) and a password: -e E2E_SIGNOUT_PASSWORD or MAESTRO_E2E_SIGNOUT_PASSWORD"
      - runFlow:
          file: helpers/sign-in-clean.yaml
          env:
            SIGN_IN_EMAIL: ${E2E_SIGNOUT_EMAIL}
            SIGN_IN_PASSWORD: "${typeof E2E_SIGNOUT_PASSWORD !== 'undefined' ? E2E_SIGNOUT_PASSWORD : MAESTRO_E2E_SIGNOUT_PASSWORD}"

- launchApp

- extendedWaitUntil:
    visible: "Notebooks"
    timeout: 30000

# --- Open Settings and wait until nothing is pending ---
# iOS labels the tab "Settings, tab, 3 of 3"; Android uses the bare title.
- tapOn: "Settings(, tab.*)?"
# iOS exposes the sync row as one element labelled "Sync status: All synced"
# (sync-status.tsx); Android shows the bare text.
- extendedWaitUntil:
    visible: "(Sync status: )?All synced"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "sign-out-button"
    direction: DOWN
    timeout: 10000

# --- Test: Sign Out asks first, with the synced copy ---
- tapOn:
    id: "sign-out-button"
- extendedWaitUntil:
    visible: "Everything is synced\\. Your notes will be here when you sign back in\\."
    timeout: 15000
- assertVisible: "Sign out\\?"
- assertNotVisible: "Sign in to your Drafto account"
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible:
          id: "android:id/button2"
      - assertVisible:
          id: "android:id/button1"
- runFlow:
    when:
      platform: iOS
    commands:
      - assertVisible: "Cancel"

# --- Test: Cancel keeps the user signed in on Settings ---
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          id: "android:id/button2"
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "Cancel"
- extendedWaitUntil:
    notVisible: "Everything is synced\\..*"
    timeout: 10000
- assertVisible:
    id: "sign-out-button"
- assertNotVisible: "Sign in to your Drafto account"

# --- Test (Android): the back key dismisses the dialog like Cancel ---
# The report's device used 3-button navigation.
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          id: "sign-out-button"
      - extendedWaitUntil:
          visible: "Everything is synced\\..*"
          timeout: 15000
      - pressKey: back
      - extendedWaitUntil:
          notVisible: "Everything is synced\\..*"
          timeout: 10000
      - assertVisible:
          id: "sign-out-button"
      - assertNotVisible: "Sign in to your Drafto account"

# --- Test (SIGN_OUT_CONFIRM=1 only): Sign out signs out ---
- runFlow:
    when:
      true: ${typeof SIGN_OUT_CONFIRM !== 'undefined' && SIGN_OUT_CONFIRM == '1'}
    commands:
      # The flow switched to the dedicated account at its start (above); a
      # confirm without it would sign the shared E2E user out everywhere.
      - assertTrue:
          condition: ${typeof E2E_SIGNOUT_EMAIL !== 'undefined' && E2E_SIGNOUT_EMAIL !== ''}
          label: "SIGN_OUT_CONFIRM=1 needs -e E2E_SIGNOUT_EMAIL: the confirm leg signs out a dedicated dev account, never the shared E2E user"
      - tapOn:
          id: "sign-out-button"
      - extendedWaitUntil:
          visible: "Everything is synced\\..*"
          timeout: 15000
      - runFlow:
          when:
            platform: Android
          commands:
            - tapOn:
                id: "android:id/button1"
      - runFlow:
          when:
            platform: iOS
          commands:
            # `below:` alone also matches the Settings button behind the
            # alert (it sits under the message too), and a tap at its centre
            # lands between the alert's buttons. Only the alert's own
            # "Sign out" is right of its Cancel.
            - tapOn:
                text: "Sign out"
                rightOf: "Cancel"
      - extendedWaitUntil:
          visible: "Log In"
          timeout: 30000
      - assertVisible: "Sign in to your Drafto account"
