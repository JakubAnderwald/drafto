appId: eu.drafto.mobile
tags:
  - qa-10668
---
# Flow 09: Show/hide password on the login and sign-up screens (PrimeTestLab 10668, S-01)
#
# Each password field has an eye toggle (testID `<field testID>-toggle`) whose accessibility
# label reads "Show password" while the value is hidden and "Hide password" while it is shown.
# Maestro can't read a secure field's text, so the switch is proven by the toggle's label on
# both platforms, plus, on Android, by the dummy value becoming readable and then masked again
# (UiAutomator reports a masked field's text as bullets). On iOS the label is the whole check.
#
# Before the fix this flow fails at the first `password-input-toggle` assertion: there is no
# toggle (and the mobile login field had no testID).
#
# Never signs in, creates no data and needs no env vars or RUN_ID. Only dummy values are typed:
# a revealed field ends up in Maestro's screenshots and logs, so never toggle a field holding
# E2E_TEST_PASSWORD.
#
# Reset password is NOT covered here: its form only renders for a recovery session, and a
# credential-less drafto://reset-password link lands on "Reset Link Problem" instead. Its two
# independent toggles (new-password-input-toggle, confirm-password-input-toggle) are covered by
# jest in __tests__/screens/reset-password.test.tsx.

# --- Clean start ---
- clearKeychain
- stopApp
- clearState
- launchApp

- extendedWaitUntil:
    visible: "Log In"
    timeout: 60000

# --- Login: hidden by default ---
- tapOn:
    id: "password-input"
- inputText: "S01visible42"
- hideKeyboard
- assertVisible:
    id: "password-input-toggle"
    text: "Show password"
- runFlow:
    when:
      platform: Android
    commands:
      - assertNotVisible: "S01visible42"

# --- Login: shown ---
- tapOn:
    id: "password-input-toggle"
- assertVisible:
    id: "password-input-toggle"
    text: "Hide password"
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible: "S01visible42"

# --- Login: hidden again ---
- tapOn:
    id: "password-input-toggle"
- assertVisible:
    id: "password-input-toggle"
    text: "Show password"
- runFlow:
    when:
      platform: Android
    commands:
      - assertNotVisible: "S01visible42"

# --- Sign-up: its own toggle ---
- tapOn:
    id: "signup-link"
- extendedWaitUntil:
    visible: "Create your Drafto account"
    timeout: 10000
- tapOn:
    id: "signup-password-input"
- inputText: "S01signup42"
- hideKeyboard
- assertVisible:
    id: "signup-password-input-toggle"
    text: "Show password"
- runFlow:
    when:
      platform: Android
    commands:
      - assertNotVisible: "S01signup42"
- tapOn:
    id: "signup-password-input-toggle"
- assertVisible:
    id: "signup-password-input-toggle"
    text: "Hide password"
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible: "S01signup42"
- tapOn:
    id: "signup-password-input-toggle"
- assertVisible:
    id: "signup-password-input-toggle"
    text: "Show password"
