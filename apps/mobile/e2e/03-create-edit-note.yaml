appId: eu.drafto.mobile
---
# Flow 03: Create, edit, and rename notes
# Depends on: 02-create-notebook (NB <RUN_ID> exists)
# Pass -e RUN_ID=<timestamp> when running

- launchApp

# Navigate to the test notebook
- extendedWaitUntil:
    visible: "Notebooks"
    timeout: 30000
- tapOn: ".*NB ${RUN_ID}"

# --- Test: empty state ---
- extendedWaitUntil:
    visible: "No notes yet"
    timeout: 10000
    optional: true

# --- Test: create a note with title ---
- tapOn:
    id: "add"
- assertVisible: "Note title (optional)"
- inputText: "Note ${RUN_ID}"
- tapOn:
    id: "checkmark"

# Verify the note appears in the list (async DB write)
- extendedWaitUntil:
    visible: ".*Note ${RUN_ID}.*"
    timeout: 10000

# A fresh install shows the list's one-time swipe hint (PrimeTestLab 10668
# S-03) above the rows; close it so the rest of the flow sees the plain list.
- tapOn:
    id: "swipe-hint-dismiss"
    optional: true

# --- Test: create a note without title ---
- tapOn:
    id: "add"
- assertVisible: "Note title (optional)"
- tapOn:
    id: "checkmark"

# An untitled note should appear
- extendedWaitUntil:
    visible: ".*Untitled.*"
    timeout: 10000

# --- Test: cancel note creation ---
- tapOn:
    id: "add"
- assertVisible: "Note title (optional)"
- inputText: "Cancelled Note"
- tapOn:
    id: "close"
- assertNotVisible: ".*Cancelled Note"

# --- Test: open note in editor ---
- tapOn: ".*Note ${RUN_ID}.*"

# Verify editor screen loads with note title
- extendedWaitUntil:
    visible: ".*Note ${RUN_ID}.*"
    timeout: 10000

# --- Test: formatting toolbar with the keyboard closed (PrimeTestLab 11035 S-02) ---
# The editor opens without focus, so the keyboard is down. The toolbar must
# still be shown; its buttons carry TenTap's accessibility labels.
- extendedWaitUntil:
    visible: "Bold"
    timeout: 10000
- assertVisible: "Italic"
- takeScreenshot: editor-toolbar-keyboard-closed

# --- Test: editor with the keyboard up ---
# The body is a WebView, so tap it by position, then type a line so the gutter
# shows. The screenshot records the layout to check by eye: a gutter around the
# body text, and the formatting toolbar directly on the keyboard with no blank
# band above it.
- tapOn:
    point: "50%,45%"
- inputText: "Body ${RUN_ID}"
- waitForAnimationToEnd
- takeScreenshot: editor-keyboard-up

# --- Test: rename via long press on notes list ---
# iOS: the editor's back button keeps the label "Notes" (the header shows the
# notebook's name on the list itself). Android's header back button is an
# unlabelled arrow, so go back with the back key, after closing the keyboard
# (otherwise the back press only dismisses it), as android-all.yaml does.
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "Notes"
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
      - pressKey: back

# Verify the title shows in the list
- extendedWaitUntil:
    visible: ".*Note ${RUN_ID}.*"
    timeout: 10000

# Long press to enter inline edit mode
- longPressOn: ".*Note ${RUN_ID}.*"
- eraseText
- inputText: "NoteF ${RUN_ID}"
- tapOn:
    id: "checkmark"
- extendedWaitUntil:
    visible: ".*NoteF ${RUN_ID}.*"
    timeout: 10000

# --- Test: pull to refresh ---
- swipe:
    direction: DOWN
