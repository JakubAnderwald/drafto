appId: eu.drafto.mobile
---
# Subflow: a clean start, signed in as SIGN_IN_EMAIL / SIGN_IN_PASSWORD, on the
# Notebooks tab. Pass both through runFlow's `env:`.
# Used through runFlow (11-sign-out-confirm's confirm leg); not a flow of its own.
#
# The clean start (clearKeychain too: iOS keeps SecureStore in the Keychain,
# which clearState leaves alone) drops the session the device had without
# calling the server, so whoever was signed in stays signed in everywhere else.
# That is how a flow changes accounts without a sign-out, which the app makes
# global. The steps are 10-swipe-hint.yaml's sign-in.

- clearKeychain
- stopApp
- clearState
- launchApp

- extendedWaitUntil:
    visible: "Log In"
    timeout: 60000

- tapOn: "you@example.com"
- inputText: ${SIGN_IN_EMAIL}
- tapOn: "Sign in to your Drafto account"
- tapOn: "Your password"
- inputText: ${SIGN_IN_PASSWORD}
- tapOn: "Sign in to your Drafto account"
- tapOn:
    id: "login-button"

# iOS offers to save the password right after login, in a sheet drawn out of
# process that hides the app from Maestro. Let it arrive, then restart the app:
# the session persists and the sheet goes away with the old process.
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible: "never-present-just-wait"
          timeout: 8000
          optional: true
      - stopApp
      - launchApp
      # The fixed wait can't see whether the sign-in had finished (the sheet
      # hides the app): if the restart beat it, the app is back on Log In, so
      # sign in once more, with no restart this time.
      - runFlow:
          when:
            visible: "Log In"
          commands:
            - tapOn: "you@example.com"
            - inputText: ${SIGN_IN_EMAIL}
            - tapOn: "Sign in to your Drafto account"
            - tapOn: "Your password"
            - inputText: ${SIGN_IN_PASSWORD}
            - tapOn: "Sign in to your Drafto account"
            - tapOn:
                id: "login-button"
            # The save-password sheet can come with this sign-in instead:
            # the same wait and restart clear it.
            - extendedWaitUntil:
                visible: "never-present-just-wait"
                timeout: 8000
                optional: true
            - stopApp
            - launchApp

- extendedWaitUntil:
    visible: "Notebooks"
    timeout: 60000
