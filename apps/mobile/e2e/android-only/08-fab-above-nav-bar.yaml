appId: eu.drafto.mobile
tags:
  - qa-10668
---
# Android 08: the "+" button inside a notebook sits above the navigation bar
# (PrimeTestLab report 10668, M-01).
#
# On 1.4.7 the notebook screen put the FAB 20dp from the bottom of an
# edge-to-edge window, so a 3-button navigation bar (48dp) covered its lower
# half. The Notebooks tab looked fine because its tab bar takes that inset.
#
# This flow only sets the scene and takes screenshots: Maestro's tapOn and
# assertVisible ignore the system bar (it isn't in the app's hierarchy), so
# they pass on 1.4.7 too. The pass/fail check is the host check
# `fabAboveNavBar` in scripts/lib/maestro-layout-checks.mjs, which
# apps/mobile/e2e/run-qa-10668-e2e.sh android runs after this flow. It reads
# the bounds of id "add" from `maestro hierarchy` and the navigationBars frame
# from `adb shell dumpsys window`, and fails when the FAB's bottom edge is
# below the nav bar's top edge. So the flow ENDS on the notebook screen.
#
# Run it on the Pixel_7_API_34 AVD in 3-button navigation mode:
#   adb shell cmd overlay enable-exclusive --category com.android.internal.systemui.navbar.threebutton
# (the runner switches the mode and restores it afterwards).
#
# Logs in when the app shows Log In, otherwise reuses the session.
# Required env: -e RUN_ID=$(date +%s)
# For the login: -e E2E_TEST_EMAIL=... -e E2E_TEST_PASSWORD=...
# Leaves "NB <RUN_ID>" with "Note <RUN_ID>"; the E2E stale purge removes them.

- launchApp

- runFlow:
    when:
      visible: "Log In"
    commands:
      - tapOn: "you@example.com"
      - inputText: ${E2E_TEST_EMAIL}
      - tapOn: "Sign in to your Drafto account"
      - tapOn: "Your password"
      - inputText: "${typeof E2E_TEST_PASSWORD !== 'undefined' ? E2E_TEST_PASSWORD : MAESTRO_E2E_TEST_PASSWORD}"
      - tapOn: "Sign in to your Drafto account"
      - tapOn:
          id: "login-button"

- extendedWaitUntil:
    visible:
      id: "search-button"
    timeout: 60000
- waitForAnimationToEnd

# Notebooks tab: the FAB clears the tab bar and must not be lifted by the
# nav-bar inset a second time.
- assertVisible:
    id: "add"
- takeScreenshot: qa-10668-m01-android-notebooks-tab

# A notebook with a note in it (the report's precondition)
- tapOn:
    id: "add"
- extendedWaitUntil:
    visible: "Notebook name"
    timeout: 10000
- inputText: "NB ${RUN_ID}"
- tapOn:
    id: "checkmark"
- extendedWaitUntil:
    visible: "NB ${RUN_ID}"
    timeout: 10000
- tapOn: "NB ${RUN_ID}"
- extendedWaitUntil:
    visible:
      id: "notes-list-screen"
    timeout: 10000
- tapOn:
    id: "add"
- assertVisible: "Note title (optional)"
- inputText: "Note ${RUN_ID}"
- tapOn:
    id: "checkmark"
- extendedWaitUntil:
    visible: "Note ${RUN_ID}"
    timeout: 10000
# The create bar's input unmounts on submit, which closes the keyboard.
- waitForAnimationToEnd

# The FAB on the notebook screen. The host check measures it from here.
- assertVisible:
    id: "add"
- takeScreenshot: qa-10668-m01-android-notebook-screen

# It still opens the create bar, then the flow returns to the same state.
- tapOn:
    id: "add"
- assertVisible: "Note title (optional)"
- tapOn:
    id: "close"
- assertVisible:
    id: "add"
- assertVisible:
    id: "notes-list-screen"
