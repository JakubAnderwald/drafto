appId: eu.drafto.mobile
tags:
  - offline
onFlowComplete:
  # However the flow ends, the emulator goes back online.
  - setAirplaneMode: disabled
---
# Flow 06: Offline notebook creation and multi-operation sync
# Depends on: 01-login (user is logged in)
# Pass -e RUN_ID=<timestamp> when running
# Run on a release APK built against dev (docs/architecture/testing.md,
# "Offline flows on Android"): a debug build loses Metro in airplane mode.
# Tests: create notebook offline, create note inside it offline,
#         all queued operations sync correctly on reconnect

- launchApp

- extendedWaitUntil:
    visible:
      id: "search-button"
    timeout: 30000

# --- Test 1: Go offline and create a notebook ---
- setAirplaneMode: enabled

- runFlow: ../helpers/assert-offline-banner.yaml

- tapOn:
    id: "add"
- assertVisible: "Notebook name"
- inputText: "OffNB ${RUN_ID}"
- tapOn:
    id: "checkmark"

# Verify notebook appears in local list
- extendedWaitUntil:
    visible: ".*OffNB ${RUN_ID}"
    timeout: 10000

# --- Test 2: Create a note inside the offline notebook ---
- tapOn: ".*OffNB ${RUN_ID}"
- tapOn:
    id: "swipe-hint-dismiss"
    optional: true

- tapOn:
    id: "add"
- tapOn: "Note title (optional)"
- inputText: "OffNest ${RUN_ID}"
- tapOn:
    id: "checkmark"

- extendedWaitUntil:
    visible: ".*OffNest ${RUN_ID}.*"
    timeout: 10000

# Go back to notebooks list
- pressKey: back

# --- Test 3: Still offline on the Notebooks tab ---
- runFlow: ../helpers/assert-offline-banner.yaml

# --- Test 4: Reconnect and verify all operations sync ---
- setAirplaneMode: disabled

- extendedWaitUntil:
    notVisible: "You are offline"
    timeout: 30000

# Verify the offline notebook still exists after sync
- extendedWaitUntil:
    visible: ".*OffNB ${RUN_ID}"
    timeout: 10000

# Verify the note inside it survived sync
- tapOn: ".*OffNB ${RUN_ID}"
- assertVisible: ".*OffNest ${RUN_ID}.*"

# --- Cleanup: delete the note and notebook ---
- swipe:
    from:
      text: ".*OffNest ${RUN_ID}.*"
    direction: LEFT
- assertVisible: "Move to Trash"
- tapOn: "Trash"
- pressKey: back

- swipe:
    from:
      text: ".*OffNB ${RUN_ID}"
    direction: LEFT
- extendedWaitUntil:
    notVisible: ".*OffNB ${RUN_ID}"
    timeout: 10000
