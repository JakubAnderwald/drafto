appId: eu.drafto.mobile
tags:
  - offline
onFlowComplete:
  # However the flow ends, the emulator goes back online.
  - setAirplaneMode: disabled
---
# Flow 05 (Android): offline mode — local data persists offline, across a cold
# start, and syncs on reconnect.
# Self-contained: creates its own notebook ("OffMode NB", a name no other flow
# uses, so 06's "OffNB" never matches it) and deletes it at the end, so it runs
# on its own or after any other flow. Assumes the user is logged in (after
# 01-login).
# Pass -e RUN_ID=<timestamp>.
# Run on a release APK built against dev (docs/architecture/testing.md,
# "Offline flows on Android"): a debug build loads its JavaScript from Metro
# at 10.0.2.2:8081, which airplane mode cuts off.
# Tests: offline banner, offline note creation, opening a note offline, data
# persistence across an offline cold start, sync on reconnect.

- launchApp
- extendedWaitUntil:
    visible:
      id: "search-button"
    timeout: 30000

# --- Online: a notebook with one note ---
- tapOn:
    id: "add"
- assertVisible: "Notebook name"
- inputText: "OffMode NB ${RUN_ID}"
- tapOn:
    id: "checkmark"
- extendedWaitUntil:
    visible: ".*OffMode NB ${RUN_ID}"
    timeout: 10000
- tapOn: ".*OffMode NB ${RUN_ID}"
- extendedWaitUntil:
    visible: "No notes yet"
    timeout: 10000
    optional: true
- tapOn:
    id: "swipe-hint-dismiss"
    optional: true
- tapOn:
    id: "add"
- assertVisible: "Note title (optional)"
- inputText: "NoteF ${RUN_ID}"
- tapOn:
    id: "checkmark"
- extendedWaitUntil:
    visible: ".*NoteF ${RUN_ID}.*"
    timeout: 10000

# --- Test 1: airplane mode shows the offline banner ---
- setAirplaneMode: enabled
- runFlow: ../helpers/assert-offline-banner.yaml

# --- Test 2: create a note while offline ---
- tapOn:
    id: "add"
- assertVisible: "Note title (optional)"
- inputText: "OffNote ${RUN_ID}"
- tapOn:
    id: "checkmark"
- extendedWaitUntil:
    visible: ".*OffNote ${RUN_ID}.*"
    timeout: 10000

# --- Test 3: open the existing note while offline ---
- tapOn: ".*NoteF ${RUN_ID}.*"
- extendedWaitUntil:
    visible: ".*NoteF ${RUN_ID}.*"
    timeout: 10000
- pressKey: back
- extendedWaitUntil:
    visible: ".*OffNote ${RUN_ID}.*"
    timeout: 10000

# --- Test 4: both notes survive a cold start while offline ---
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: "search-button"
    timeout: 30000
- runFlow: ../helpers/assert-offline-banner.yaml
- tapOn: ".*OffMode NB ${RUN_ID}"
- extendedWaitUntil:
    visible: ".*NoteF ${RUN_ID}.*"
    timeout: 10000
- assertVisible: ".*OffNote ${RUN_ID}.*"

# --- Test 5: back online, the banner goes and the notes stay ---
- setAirplaneMode: disabled
- extendedWaitUntil:
    notVisible: "You are offline"
    timeout: 30000
- assertVisible: ".*NoteF ${RUN_ID}.*"
- assertVisible: ".*OffNote ${RUN_ID}.*"

# --- Cleanup: trash both notes, delete the notebook, then check everything synced ---
- swipe:
    from:
      text: ".*OffNote ${RUN_ID}.*"
    direction: LEFT
- assertVisible: "Move to Trash"
- tapOn: "Trash"
- extendedWaitUntil:
    notVisible: ".*OffNote ${RUN_ID}.*"
    timeout: 10000
- swipe:
    from:
      text: ".*NoteF ${RUN_ID}.*"
    direction: LEFT
- assertVisible: "Move to Trash"
- tapOn: "Trash"
- extendedWaitUntil:
    notVisible: ".*NoteF ${RUN_ID}.*"
    timeout: 10000
- pressKey: back
- extendedWaitUntil:
    visible:
      id: "search-button"
    timeout: 10000
- swipe:
    from:
      text: ".*OffMode NB ${RUN_ID}"
    direction: LEFT
- extendedWaitUntil:
    notVisible: ".*OffMode NB ${RUN_ID}"
    timeout: 10000
- tapOn: "Settings"
# The sync row's accessibility label is "Sync status: <state>"
- extendedWaitUntil:
    visible: "Sync status: All synced"
    timeout: 30000
