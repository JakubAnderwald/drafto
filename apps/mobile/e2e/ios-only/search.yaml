appId: eu.drafto.mobile
---
# iOS search flow
# Assumes user is already logged in (run after 01-login or ios-all)
# Run with: maestro test apps/mobile/e2e/ios-only/search.yaml --platform ios

- launchApp
- extendedWaitUntil:
    visible: "Notebooks"
    timeout: 30000

# Open search screen (tap the search button by testID)
- tapOn:
    id: "search-button"
- extendedWaitUntil:
    visible: "Search"
    timeout: 10000

# Type a search query
- tapOn: "Search notes and notebooks..."
- inputText: "test"

# Verify search executed — either results or empty state is acceptable
- extendedWaitUntil:
    visible: "No notes found"
    timeout: 10000
    optional: true

# A note opened from Search is a sheet of its own on iOS, with a close button
# that returns to the results. Skipped when the query matched nothing.
- runFlow:
    when:
      visible:
        id: "search-result"
    commands:
      - tapOn:
          id: "search-result"
          index: 0
      - extendedWaitUntil:
          visible:
            id: "note-sheet-close"
          timeout: 10000
      - tapOn:
          id: "note-sheet-close"
      - extendedWaitUntil:
          visible: "Search"
          timeout: 10000

# Close the search sheet with its close button
- tapOn:
    id: "search-close"
- extendedWaitUntil:
    visible: "Notebooks"
    timeout: 10000
