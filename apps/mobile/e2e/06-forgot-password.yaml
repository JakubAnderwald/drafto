appId: eu.drafto.mobile
---
# Flow 06: Forgot password
# Tests: the link from login, the request screen, and — crucially — that the
# recovery deep link opens IN the app rather than bouncing to the website.
#
# The real recovery link cannot be exercised here: it arrives by email, and its
# PKCE code is single-use and redeemable only on the device that asked for it.
# What is verifiable without a mailbox is the routing, so this flow opens
# `drafto://reset-password` with no credentials and asserts the app lands on its
# own reset screen and reports the bad link. It then opens a forged link carrying
# session tokens and asserts the same: tokens in a deep link sign no one in. A
# regression in the deep-link config or the route guard shows up as an unmatched
# route, a bounce to login, or the main app — all of which fail here.
#
# No -e vars needed: the flow creates no user data and never signs in.

# --- Clean start, signed out ---
- clearKeychain
- stopApp
- clearState
- launchApp

- extendedWaitUntil:
    visible: "Log In"
    timeout: 60000

# --- Test: reach the request screen from login ---
- tapOn:
    id: "forgot-password-link"
- extendedWaitUntil:
    visible: "Forgot Password"
    timeout: 10000
- assertVisible: "We'll email you a link to set a new password"

# --- Test: an empty submission is rejected locally ---
- tapOn:
    id: "forgot-password-submit"
- assertVisible: "Please enter your email address."

# --- Test: requesting a link shows the same confirmation as web ---
# The address has no account, on purpose. Supabase answers a reset for an
# unknown address with the same success as for a real one and sends nothing,
# so the request is real but no email goes out. The E2E account can't be used
# here: dev has no custom SMTP, and Supabase's built-in mailer refuses it
# (`email_address_invalid`) and allows 2 emails an hour per project
# (`email rate limit exceeded`). example.com is reserved (RFC 2606), so the
# address can never be a real mailbox. If this step shows an error instead of
# the confirmation, read it: the offline message or a network error is the
# device or dev being unreachable. Only `email_address_invalid` or a rate-limit
# message means someone has created an account with this address on dev.
- tapOn:
    id: "forgot-password-email-input"
- inputText: "e2e-no-account@example.com"
- hideKeyboard
- tapOn:
    id: "forgot-password-submit"
- extendedWaitUntil:
    visible: "Check Your Email"
    timeout: 20000
# The address is a nested <Text> inside the sentence, which is one element, and
# Maestro matches an element's whole text, so match the sentence around it.
- assertVisible: ".*sent a password reset link to e2e-no-account@example\\.com.*"

# --- Test: back to login ---
- tapOn: "Back to login"
- extendedWaitUntil:
    visible: "Log In"
    timeout: 10000

# --- Test: the recovery deep link opens the in-app reset screen ---
# Credential-less on purpose: a real code cannot be minted from a test flow.
# The assertion is that the app claims the link at all and renders its own
# screen — not an unmatched route, not the website, not the notebook list.
- openLink: "drafto://reset-password"
# iOS asks "Open in “Drafto”?" before it hands a custom-scheme link to the app.
# The button is labelled in the simulator's language: "Open", or "Otwórz" on a
# Polish one; for any other language, add its label here. Optional, because
# iOS asks only some of the time, on the same simulator and build. If "Reset
# Link Problem" then times out on iOS, look for this prompt in the failure
# screenshot.
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          text: "Open|Otwórz"
          optional: true
- extendedWaitUntil:
    visible: "Reset Link Problem"
    timeout: 20000
- assertVisible: "This password reset link is missing its credentials. Request a new one."
- assertNotVisible: "Notebooks"

# --- Test: dismissing a failed link returns a signed-out user to login ---
- tapOn:
    id: "reset-password-dismiss"
- extendedWaitUntil:
    visible: "Log In"
    timeout: 15000

# --- Test: a forged link carrying session tokens does not sign anyone in ---
# The client runs PKCE (ADR-0045), so only a `code` counts. Any website or app
# can open a link like this one; honouring its tokens would sign the app into
# whoever owns them.
- openLink: "drafto://reset-password#access_token=forged&refresh_token=forged&type=recovery"
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          text: "Open|Otwórz"
          optional: true
- extendedWaitUntil:
    visible: "Reset Link Problem"
    timeout: 20000
- assertVisible: "This password reset link is missing its credentials. Request a new one."
- assertNotVisible: "Notebooks"
- tapOn:
    id: "reset-password-dismiss"
- extendedWaitUntil:
    visible: "Log In"
    timeout: 15000
