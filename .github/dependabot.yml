version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # react-native-macos, react-native and desktop's @react-native/* tooling move together.
      # Desktop pins rnm exactly, rnm peers one exact react-native, and desktop pins
      # react-native and its tooling to that peer. It is also the one hoisted react-native
      # mobile builds against. scripts/__tests__/desktop-native-build-config.test.mjs fails
      # when they disagree: a react-native or tooling patch without an rnm release that
      # peers it, or an rnm release that peers a react-native the PR doesn't move. In a
      # shared group that would hold up every other package in it, so they get one PR of
      # their own, and that PR is how rnm releases are tracked (ADR-0067). The group is
      # listed before minor-and-patch because Dependabot puts a dependency in the first
      # group it matches, and minor-and-patch also excludes the same names. A react-native
      # patch rnm doesn't peer yet keeps the PR red until an rnm release does, so mobile's
      # react-native patches wait for rnm too. Mobile's @react-native/jest-preset isn't
      # tied to rnm's peer, so it stays in minor-and-patch. Before the PR merges:
      #   - an rnm minor needs the desktop patch re-made with `pnpm patch` (or dropped if
      #     upstream now guards a nil reactTag): the patch key `react-native-macos@~0.83.0`
      #     matches nothing after one, and `pnpm install` rejects the unused patch. It also
      #     needs react-native (both apps) and desktop's tooling raised to its peer by hand,
      #     because the ignore rules below keep their minors out of the PR, and mobile's
      #     react-native minor waits for an Expo SDK that supports it;
      #   - an rnm patch release needs the patch to still apply;
      #   - any change to rnm or react-native needs a TestFlight build that opens a note,
      #     because CI does not build macOS.
      react-native:
        patterns:
          - "react-native-macos"
          - "react-native"
          - "@react-native/babel-preset"
          - "@react-native/metro-config"
          - "@react-native/typescript-config"
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
        exclude-patterns:
          - "react-native-macos"
          - "react-native"
          - "@react-native/babel-preset"
          - "@react-native/metro-config"
          - "@react-native/typescript-config"
    ignore:
      # Expo-SDK-aligned packages must track the pinned Expo SDK (~55); the SDK is bumped
      # deliberately as one coordinated step. Major bumps ahead of the SDK break the React
      # Native / Expo build and can never merge, so Dependabot retries them forever — the
      # dominant source of nightly-audit false positives. Suppress semver-major bumps for the
      # whole Expo family: bare `expo`, `expo-*`, scoped `@expo/*` (e.g. @expo/vector-icons),
      # and the Expo tooling packages that lack an `expo` prefix. Minor/patch updates still
      # flow through the minor-and-patch group above.
      - dependency-name: "expo"
        update-types: ["version-update:semver-major"]
      - dependency-name: "expo-*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@expo/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-config-expo"
        update-types: ["version-update:semver-major"]
      - dependency-name: "jest-expo"
        update-types: ["version-update:semver-major"]
      # React Native and its native community modules are pinned by the Expo SDK
      # (set via `expo install`), not Dependabot. In RN's 0.x line a *minor* bump is a
      # breaking change: RN 0.83 → 0.86 ran ahead of Expo SDK 55 (whose bundled
      # @react-native/codegen is 0.83.x) and broke the release-bundle codegen, which can
      # never merge — so suppress minor + major for the RN family. Patch updates within
      # the SDK's supported minor still flow: through the react-native group for
      # react-native itself, through the minor-and-patch group for the modules.
      - dependency-name: "react-native"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "react-native-safe-area-context"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "react-native-screens"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "react-native-svg"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "react-native-webview"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # The scoped `@react-native/*` build tooling (babel-preset, metro-config,
      # typescript-config, jest-preset) is part of the same 0.x train and must stay aligned
      # with the React Native version each app is pinned to — a minor bump silently changes
      # how the app's JS is compiled. 0.86 → 0.87 flipped the babel preset's default
      # transform profile from `default` to `hermes-stable`, which drops
      # @babel/plugin-transform-class-properties and so breaks the legacy decorators that
      # WatermelonDB models depend on (`@field("remote_id") remoteId!: string`). That fails
      # desktop's Jest run outright, and would change the bundle the react-native-macos app
      # ships, which CI cannot verify because it does not build macOS. Desktop pins these to
      # the react-native version react-native-macos peers (ADR-0067). Suppress minor + major;
      # patches still flow: desktop's tooling through the react-native group above, mobile's
      # jest-preset through minor-and-patch.
      - dependency-name: "@react-native/*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # The React Native CLI core and its iOS platform package are one pipeline:
      # `use_native_modules!` in desktop's Podfile runs the core's `config`, which builds
      # the macOS config through cli-platform-ios and its exact-pinned cli-platform-apple.
      # Desktop pins both to one version and they move together, never one alone. Majors
      # fall outside the group, so Dependabot would open one PR per package and either
      # could merge alone. Suppress majors; a major moves deliberately, with
      # react-native-macos (ADR-0067). Minor and patch updates of both still arrive together
      # in the group. `cli-*` matches cli-platform-ios but not @react-native-community/netinfo.
      - dependency-name: "@react-native-community/cli"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@react-native-community/cli-*"
        update-types: ["version-update:semver-major"]
      # React (`react`, `react-dom`, `react-test-renderer`) is governed by the root
      # package.json's `pnpm.overrides`, not by the apps' own declarations — the override is
      # what forces a single shared React instance across all four workspaces, which
      # ADR-0027 / #558 established is mandatory (multiple React copies, even at the same
      # version, break Context/hook identity and render an empty tree with no error).
      # Dependabot cannot edit `pnpm.overrides`. It can only rewrite pnpm-lock.yaml's
      # `overrides:` block, so every React bump it opens is one of two useless shapes:
      # inert (bumps apps/*/package.json while the override silently overrules it, as in
      # #593) or unmergeable (a lockfile-only override edit that aborts every install with
      # ERR_PNPM_LOCKFILE_CONFIG_MISMATCH, as in #609 — which also failed the Vercel preview
      # deployment). Suppress the family entirely; React moves when someone edits
      # `pnpm.overrides` and regenerates the lockfile as one deliberate step (#441, #610).
      # This does not freeze React contrary to ADR-0027 §5 — it suppresses a mechanism that
      # is structurally incapable of moving it, and leaves the deliberate cadence intact.
      # React advisories still show as Dependabot alerts in the Security tab, and their fix is
      # the same override edit. scripts/__tests__/react-override-alignment.test.mjs fails
      # if an app's declaration drifts from the override again (#635).
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-test-renderer"
